name: brain-assistant-backend

services:
  brain-assistant-db:
    image: postgres:16-alpine
    container_name: brain-assistant-db
    environment:
      POSTGRES_DB: brain_assistant_backend
      POSTGRES_USER: brain_backend
      POSTGRES_PASSWORD: brain_backend_dev_password
    ports:
      - "55432:5432"
    volumes:
      - brain_assistant_backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_backend -d brain_assistant_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  brain-assistant-api:
    build:
      context: .
    container_name: brain-assistant-api
    environment:
      ENVIRONMENT: development
      FRONTEND_BASE_URL: http://localhost:3010
      DATABASE_URL: postgresql+psycopg://brain_backend:brain_backend_dev_password@brain-assistant-db:5432/brain_assistant_backend
      SECRET_KEY: dev-only-change-before-production-64-character-secret-key-for-local-auth
      BACKEND_CORS_ORIGINS: http://localhost:3010,http://127.0.0.1:3010
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      AUTH_COOKIE_SECURE: "false"
      MAIL_MODE: dev
      MAIL_FROM: Brain Assistant <no-reply@brainassistant.local>
      SMTP_HOST: brain-assistant-mailhog
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      SMTP_STARTTLS: "false"
      EMAIL_VERIFICATION_EXPIRE_HOURS: 24
      INVITATION_EXPIRE_DAYS: 7
      UPLOAD_STORAGE_PATH: /app/storage/uploads
      UPLOAD_MAX_BYTES: 26214400
    ports:
      - "8010:8010"
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      brain-assistant-db:
        condition: service_healthy
      brain-assistant-mailhog:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             fastapi run app/main.py --host 0.0.0.0 --port 8010"

  brain-assistant-mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: brain-assistant-mailhog
    ports:
      - "1125:1025"
      - "8125:8025"

volumes:
  brain_assistant_backend_pg_data:
