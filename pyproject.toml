[project]
name = "brain-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for Brain Assistant."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "argon2-cffi>=23.1.0",
  "celery[redis]>=5.3.0",
  "email-validator>=2.2.0",
  "lightrag-hku>=1.4.0",
  "fastapi[standard]>=0.115.0",
  "httpx>=0.27.2",
  "ollama>=0.6.0",
  "playwright>=1.49.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.6.0",
  "pyjwt[crypto]>=2.9.0",
  "python-docx>=1.1.2",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
